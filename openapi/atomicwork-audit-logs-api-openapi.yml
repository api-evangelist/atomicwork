openapi: 3.2.0
info:
  title: Atomicwork Public Audit Logs API
  version: 1.0.0
servers:
- url: https://{tenant}.atomicwork.com
  description: Your Atomicwork tenant
tags:
- name: Audit Logs
paths:
  /api/v1/audit-logs:
    get:
      operationId: auditLogs_getapi_v1_audit_logs
      summary: Get all audit logs
      tags:
      - Audit Logs
      parameters:
      - name: search_key
        in: query
        description: ''
        required: false
        schema:
          type: string
          minLength: 1
      - name: page
        in: query
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          minimum: 10
          maximum: 100
          default: 25
      - name: next_page_token
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit_Logs_getapi_v1_audit_logs_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/audit-logs/list:
    post:
      operationId: auditLogs_postapi_v1_audit_logs_list
      summary: List audit logs with filters
      description: 'List audit logs with structured filters for actor, module, and event type

        ### Filtering


        Use the `filters` field to narrow results. Pass an empty array or omit the field to retrieve all records. Each filter object has the following fields:


        | Field | Type | Description |

        |---|---|---|

        | `attribute` | string | The field to filter on (see Supported attributes below) |

        | `operator` | string | Comparison operator (see Available operators below) |

        | `values` | array | One or more `{ "value": }` objects |


        **Supported attributes**


        | Attribute | Typical operator | Description |

        |---|---|---|

        | `event_at` | `IS_BETWEEN` | Event timestamp. Requires exactly **two** values: `[start, end]` (both inclusive). Accepts ISO 8601 (`2024-01-01T00:00:00Z`) or date-only (`2024-01-01` — end date is automatically extended to `T23:59:59Z`). On export, defaults to the last 6 months if omitted. |

        | `actor_id` | `IS_ANY_OF` | Numeric user ID of the person who performed the action (the `id` field from `GET /api/v1/users`). |

        | `module` | `IS_ANY_OF` | Module **integer ID** (not the name). See the Module IDs reference table below. |

        | `event_type` | `IS_ANY_OF` | Event type **integer ID** (not the name). See the Event Type IDs reference table below. Not every event type is valid for every module — unsupported combinations return zero results.'
      tags:
      - Audit Logs
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit_Logs_postapi_v1_audit_logs_list_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                search_key:
                  type: string
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 10
                  maximum: 100
                  default: 25
                next_page_token:
                  type: string
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItems'
                sort_order:
                  $ref: '#/components/schemas/ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaSortOrder'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    Audit_Logs_postapi_v1_audit_logs_list_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Audit Logs_postapi_v1_audit_logs_list_Response_200
    Audit_Logs_getapi_v1_audit_logs_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Audit Logs_getapi_v1_audit_logs_Response_200
    ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaSortOrder:
      type: string
      enum:
      - EVENT_AT_DESC
      - EVENT_AT_ASC
      title: ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaSortOrder
    ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItems:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItemsValue'
          description: 'A bare scalar - number, string or boolean - never a JSON object or array. Search filters accept text, numeric ids, dates, or booleans; pass entity or reference ids as bare numbers, not objects such as {"id": 4009}.'
        nested_filter:
          description: Any type
      title: ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItems
    ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsOperator:
      type: string
      enum:
      - LIKE
      - EQUALS
      - IN
      - NOT_EQUALS
      - IS_BETWEEN
      - IS_ANY_OF
      - IS_NOT_ANY_OF
      title: ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsOperator
    ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItemsValue:
      type: object
      properties: {}
      description: 'A bare scalar - number, string or boolean - never a JSON object or array. Search filters accept text, numeric ids, dates, or booleans; pass entity or reference ids as bare numbers, not objects such as {"id": 4009}.'
      title: ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItemsValue
    ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItems:
      type: object
      properties:
        attribute:
          type: string
        operator:
          $ref: '#/components/schemas/ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsOperator'
        values:
          type: array
          items:
            $ref: '#/components/schemas/ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItemsValuesItems'
      title: ApiV1AuditLogsListPostRequestBodyContentApplicationJsonSchemaFiltersItems
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
x-provenance:
  method: harvested
  publisher: Atomicwork
  source: https://support.atomicwork.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
