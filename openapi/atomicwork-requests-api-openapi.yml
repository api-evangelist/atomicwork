      summary: Create request notes
      description: 'Creates a note on the request. The note body may mention individual users

        (`mentions`) and agent groups (`agent_group_mentions`). Public notes notify the

        requester, assignee and all followers, where the follower set is the union of

        direct user followers and members of any agent groups following the request,

        de-duplicated. Agent groups listed in `agent_group_mentions` are added as

        request followers. Private/internal notes are excluded from follower notifications.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests__requestId__notes_Response_200'
      requestBody:
        description: 'Payload to create a request note. Mentions (`mentions`) and agent-group mentions

          (`agent_group_mentions`) can be supplied. Public notes notify the requester,

          assignee and all followers (direct users plus members of any agent groups following

          the request, de-duplicated). Agent groups listed in `agent_group_mentions` are

          added as request followers.

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int64
                conversation_id:
                  type: integer
                  format: int64
                  description: When set, the reply is mirrored into this conversation's thread (UAG).
                description:
                  type: string
                mentions:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: User IDs mentioned in the note. Mentioned users are notified and added as direct followers.
                agent_group_mentions:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 'Agent group IDs mentioned in the note. Members of these groups are notified

                    and the groups are added as request followers.

                    '
                is_private:
                  type: boolean
                  default: false
                source:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdNotesPostRequestBodyContentApplicationJsonSchemaSource'
                type:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdNotesPostRequestBodyContentApplicationJsonSchemaType'
                attachments:
                  type: array
                  items:
                    type: integer
                    format: int64
                cc_emails:
                  type: array
                  items:
                    type: string
                bcc_emails:
                  type: array
                  items:
                    type: string
                is_broadcast:
                  type: boolean
                  default: false
                external_id:
                  type: string
                external_source_type:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdNotesPostRequestBodyContentApplicationJsonSchemaExternalSourceType'
                email_content:
                  type: string
                event_created_at:
                  type: string
                  format: date-time
                  description: Event creation timestamp. When provided via public API, also backdates the note's created time, SLA metrics, and activity timestamps. Must not be in the future or before the request's creation time.
                transition:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdNotesPostRequestBodyContentApplicationJsonSchemaTransition'
                  description: 'Applied in the same transaction as the note: both commit, or neither does. Takes the same body PATCH /requests/{requestId} accepts'
      security:
      - ApiKeyAuth: []
