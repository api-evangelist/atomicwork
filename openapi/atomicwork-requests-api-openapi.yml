      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/add-followers:
    patch:
      operationId: requests_patchapi_v1_requests__requestId__add_followers
      summary: Add Followers to a Request
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_patchapi_v1_requests__requestId__add_followers_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                follower_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/modify-agent-group-followers:
    put:
      operationId: requests_putapi_v1_requests__requestId__modify_agent_group_followers
      summary: Add or Remove Agent Group Followers
      description: 'Replaces the complete list of agent groups that are following this request.

        Members of the supplied groups are expanded into the follower recipient set

        for notifications, de-duplicated against direct user followers. This affects

        both channel/email notifications and in-app follower notifications.

        Private notes never notify followers.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_putapi_v1_requests__requestId__modify_agent_group_followers_Response_200'
      requestBody:
        description: 'Payload used to replace the list of agent groups that follow a request.

          Members of the supplied groups are included in the follower notification

          recipient set, de-duplicated with direct user followers.

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_group_follower_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 'Agent group IDs to set as followers. Their members are expanded into the

                    follower recipient set for notifications (de-duplicated with direct followers).

                    '
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/agent-group-followers:
    get:
      operationId: requests_getapi_v1_requests__requestId__agent_group_followers
      summary: Get Agent Group Followers of a Request
      description: 'Returns the agent groups that are currently followers of this request.

        Members of these groups receive follower-targeted notifications for public

        request events, alongside any direct user followers.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_getapi_v1_requests__requestId__agent_group_followers_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/add-agent-group-followers:
    patch:
      operationId: requests_patchapi_v1_requests__requestId__add_agent_group_followers
      summary: Add Agent Group Followers to a Request
      description: 'Appends agent groups to the request''s existing agent-group follower list.

        Duplicate groups are ignored. Members of the resulting groups are expanded

        into the follower notification recipient set (de-duplicated with direct followers)

        for both channel/email and in-app notifications.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_patchapi_v1_requests__requestId__add_agent_group_followers_Response_200'
      requestBody:
        description: 'Payload used to append agent groups to the existing agent-group follower list.

          Duplicate groups are ignored. Members of the resulting groups are included in

          follower notifications, de-duplicated with direct user followers.

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_group_follower_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 'Agent group IDs to append to the request''s agent-group followers. Their

                    members are expanded into the follower recipient set for notifications

                    (de-duplicated with direct followers).

                    '
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/trash:
    put:
      operationId: requests_putapi_v1_requests__requestId__trash
      summary: Trash Request
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
