      operationId: postapi-v-1-requests-items-item-id
      summary: Create service request for item
      tags:
      - requests
      parameters:
      - name: item_id
        in: path
        description: The item ID
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
