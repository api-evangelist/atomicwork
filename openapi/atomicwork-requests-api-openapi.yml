openapi: 3.2.0
info:
  title: Atomicwork Public Requests API
  version: 1.0.0
servers:
- url: https://{tenant}.atomicwork.com
  description: Your Atomicwork tenant
tags:
- name: Requests
paths:
  /api/v1/requests:
    post:
      operationId: requests_postapi_v1_requests
      summary: Create request
      tags:
      - Requests
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_type:
                  type: string
                request_source:
                  $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaRequestSource'
                category:
                  type: string
                subcategory:
                  type: string
                cti_item:
                  type: string
                description:
                  type: string
                email_content:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                parent_request_id:
                  type: integer
                  format: int64
                agent_group:
                  type: integer
                  format: int64
                  description: ID of the agent group to associate with the request. Members of this group are included in follower notifications when the group is also a request follower.
                assignee:
                  type: integer
                  format: int64
                  description: ID of the user assigned to the request.
                subject:
                  type: string
                notes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaNotesItems'
                workspace_id:
                  type: integer
                  format: int64
                conversation_info:
                  $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaConversationInfo'
                tags:
                  type: array
                  items:
                    type: integer
                    format: int64
                cc_emails:
                  type: array
                  items:
                    type: string
                bcc_emails:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  items:
                    type: integer
                    format: int64
                requester:
                  type: integer
                  format: int64
                to_email:
                  type: string
                request_created_from:
                  $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaRequestCreatedFrom'
                custom_fields:
                  $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaCustomFields'
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                external_id:
                  type: string
                external_source:
                  $ref: '#/components/schemas/ApiV1RequestsPostRequestBodyContentApplicationJsonSchemaExternalSource'
                resolution_time:
                  type: string
                  format: date-time
                  description: 'When the ticket was resolved in the source system. Only accepted during migration (requires external_id or external_source).

                    '
                first_response_time:
                  type: string
                  format: date-time
                  description: 'When the first agent response occurred in the source system. Only accepted during migration (requires external_id or external_source).

                    '
                first_response_due_time:
                  type: string
                  format: date-time
                  description: 'SLA due time for first response from the source system. Only accepted during migration (requires external_id or external_source).

                    '
                resolution_due_time:
                  type: string
                  format: date-time
                  description: 'SLA due time for resolution from the source system. Only accepted during migration (requires external_id or external_source).

                    '
                closed_status_at:
                  type: string
                  format: date-time
                  description: 'When the ticket was moved to closed status in the source system. Only accepted during migration (requires external_id or external_source). When provided with a closed status, also sets resolution_time if not explicitly provided.

                    '
      security:
      - ApiKeyAuth: []
  /api/v1/requests/bulk-actions/{bulk_action_type}:
    post:
      operationId: requests_postapi_v1_requests_bulk_actions__bulk_action_type
      summary: Bulk action on requests
      tags:
      - Requests
      parameters:
      - name: bulk_action_type
        in: path
        description: The bulk action type
        required: true
        schema:
          $ref: '#/components/schemas/ApiV1RequestsBulkActionsBulkActionTypePostParametersBulkActionType'
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests_bulk_actions__bulk_action_type_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_ids:
                  type: array
                  items:
                    type: string
                assignee:
                  type: string
                tags:
                  type: array
                  items:
                    type: integer
                    format: int64
                option_label:
                  type: string
                sub_option_label:
                  type: string
                sub_sub_option_label:
                  type: string
                  description: Optional 3rd CTI level (item) for the "category" bulk action, applied under sub_option_label (subcategory).
                all_children:
                  type: boolean
                major_incident_display_id:
                  type: string
      security:
      - ApiKeyAuth: []
  /api/v1/requests/list:
    post:
      operationId: requests_postapi_v1_requests_list
      summary: Get requests by filter
      description: '### Filtering


        The request body is an **array of filter objects**. Send an empty array (`[]`) to retrieve all records.


        Each filter object has the following fields:


        | Field | Type | Description |

        |---|---|---|

        | `attribute` | string | The field to filter on (see Supported attributes below) |

        | `operator` | string | Comparison operator (see Available operators below) |

        | `values` | array | One or more `{ "value": }` objects |


        **Supported attributes**


        | Attribute | Typical operator | Description |

        |---|---|---|

        | `status` | `IS_ANY_OF` | Ticket status (e.g. `OPEN`, `IN_PROGRESS`, `RESOLVED`, `CLOSED`). |

        | `type` | `IS_ANY_OF` | Request type (e.g. `INCIDENT`, `SERVICE_REQUEST`, `GENERAL_REQUEST`). |

        | `assignee_id` | `IS_ANY_OF` | Assigned agent user ID. |

        | `requester_id` | `IS_ANY_OF` | Requester user ID. |

        | `created_at` | `IS_BETWEEN` | Creation timestamp (ISO 8601). Use for date range filtering. |

        | `updated_at` | `IS_BETWEEN` | Last-updated timestamp (ISO 8601). |


        **Available operators**


        | Operator | Meaning |

        |---|---|

        | `EQUALS` | Exact match |

        | `NOT_EQUALS` | Exclude exact match |

        | `IN` / `IS_ANY_OF` | Match any value in the list |

        | `IS_NOT_ANY_OF` | Exclude all listed values |

        | `IS_BETWEEN` | Inclusive range — pass exactly two values: `[start, end]` |

        | `IS_ON_OR_BEFORE` / `IS_ON_OR_AFTER` | Date/time boundary comparisons |

        | `CONTAINS` / `TEXT_CONTAINS` | Substring or set membership |

        | `IS_NULL` / `IS_NOT_NULL` | Null checks — `values` array can be empty |

        | `STARTS_WITH` / `ENDS_WITH` | String prefix/suffix match |


        **Example**


        ```json

        [

        {

        "attribute": "status",

        "operator": "IS_ANY_OF",

        "values": [

        {

        "value": "OPEN"

        },

        {

        "value": "IN_PROGRESS"

        }

        ]

        },

        {

        "attribute": "created_at",

        "operator": "IS_BETWEEN",

        "values": [

        {

        "value": "2024-01-01T00:00:00Z"

        },

        {

        "value": "2024-12-31T23:59:59Z"

        }

        ]

        }

        ]

        ```'
      tags:
      - Requests
      parameters:
      - name: filter_name
        in: query
        description: ''
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 40
      - name: sort_order
        in: query
        description: ''
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1RequestsListPostParametersSortOrder'
      - name: sort
        in: query
        description: Generic ordered sort as a compact string, e.g. `created_at:ASC,subject:DESC`. Field keys are validated server-side against the view-column allowlist. When present, takes precedence over the legacy `sort_order` enum.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests_list_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV1RequestsListPostRequestBodyContentApplicationJsonSchemaItems'
      security:
      - ApiKeyAuth: []
  /api/v1/workspaces/{workspace_id}/requests/list:
    post:
      operationId: requests_postapi_v1_workspaces__workspace_id__requests_list
      summary: Get requests by filter
      description: '### Filtering


        The request body is an **array of filter objects**. Send an empty array (`[]`) to retrieve all records.


        Each filter object has the following fields:


        | Field | Type | Description |

        |---|---|---|

        | `attribute` | string | The field to filter on (see Supported attributes below) |

        | `operator` | string | Comparison operator (see Available operators below) |

        | `values` | array | One or more `{ "value": }` objects |


        **Supported attributes**


        | Attribute | Typical operator | Description |

        |---|---|---|

        | `status` | `IS_ANY_OF` | Ticket status (e.g. `OPEN`, `IN_PROGRESS`, `RESOLVED`, `CLOSED`). |

        | `type` | `IS_ANY_OF` | Request type (e.g. `INCIDENT`, `SERVICE_REQUEST`, `GENERAL_REQUEST`). |

        | `assignee_id` | `IS_ANY_OF` | Assigned agent user ID. |

        | `requester_id` | `IS_ANY_OF` | Requester user ID. |

        | `created_at` | `IS_BETWEEN` | Creation timestamp (ISO 8601). Use for date range filtering. |

        | `updated_at` | `IS_BETWEEN` | Last-updated timestamp (ISO 8601). |


        **Available operators**


        | Operator | Meaning |

        |---|---|

        | `EQUALS` | Exact match |

        | `NOT_EQUALS` | Exclude exact match |

        | `IN` / `IS_ANY_OF` | Match any value in the list |

        | `IS_NOT_ANY_OF` | Exclude all listed values |

        | `IS_BETWEEN` | Inclusive range — pass exactly two values: `[start, end]` |

        | `IS_ON_OR_BEFORE` / `IS_ON_OR_AFTER` | Date/time boundary comparisons |

        | `CONTAINS` / `TEXT_CONTAINS` | Substring or set membership |

        | `IS_NULL` / `IS_NOT_NULL` | Null checks — `values` array can be empty |

        | `STARTS_WITH` / `ENDS_WITH` | String prefix/suffix match |


        **Example**


        ```json

        [

        {

        "attribute": "status",

        "operator": "IS_ANY_OF",

        "values": [

        {

        "value": "OPEN"

        },

        {

        "value": "IN_PROGRESS"

        }

        ]

        },

        {

        "attribute": "created_at",

        "operator": "IS_BETWEEN",

        "values": [

        {

        "value": "2024-01-01T00:00:00Z"

        },

        {

        "value": "2024-12-31T23:59:59Z"

        }

        ]

        }

        ]

        ```'
      tags:
      - Requests
      parameters:
      - name: workspace_id
        in: path
        description: Workspace ID (numeric). Find yours under Settings → Workspace.
        required: true
        schema:
          type: integer
          format: int64
      - name: filter_name
        in: query
        description: ''
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 40
      - name: is_problem
        in: query
        description: ''
        required: false
        schema:
          type: boolean
      - name: sort_order
        in: query
        description: ''
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1WorkspacesWorkspaceIdRequestsListPostParametersSortOrder'
      - name: sort
        in: query
        description: Generic ordered sort as a compact string, e.g. `priority:DESC,created_at:ASC`. Field keys are validated server-side against the view-column allowlist. When present, takes precedence over the legacy `sort_order` enum.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: request_type_filter
        in: query
        description: ''
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ApiV1WorkspacesWorkspaceIdRequestsListPostParametersRequestTypeFilterSchemaItems'
      - name: drilldown_token
        in: query
        description: Opaque analytics drill-down token identifying one Request Overview V2 widget grouping (from `POST /api/v2/workspaces/{workspace_id}/analytics/request`). Restricts the result to the requests behind that widget number. It is combined with any other filters sent and re-validated against current data, so requests since deleted, moved, or no longer visible to the caller are absent. A grouping whose count was genuinely zero returns an empty result; a token that no longer resolves returns 410 `DRILLDOWN_TOKEN_EXPIRED`, so the caller re-runs the report rather than showing an empty list. When present, `is_problem` and `request_type_filter` are ignored — the widget query applies no request-type predicate, so any narrowing would disagree with the metric — and `filter_name` is forced to `all` server-side, so the value sent is not honoured; any `duration` filter is stripped.
        required: false
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_workspaces__workspace_id__requests_list_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV1WorkspacesWorkspaceIdRequestsListPostRequestBodyContentApplicationJsonSchemaItems'
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}:
    get:
      operationId: requests_getapi_v1_requests__requestId
      summary: Get Request
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_getapi_v1_requests__requestId_Response_200'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: requests_patchapi_v1_requests__requestId
      summary: Patch request
      description: 'Applies a partial JSON patch update to a request. Fields such as `agent_group`

        and `assignee` can be updated. Follower notifications include both direct user

        followers and members of any agent groups following the request, de-duplicated.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_patchapi_v1_requests__requestId_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/move:
    post:
      operationId: requests_postapi_v1_requests__requestId__move
      summary: Move Request
      description: '**DEPRECATED**: Use `/requests/{requestId}/move/result` instead.


        This endpoint does not handle permission-based responses correctly when the user

        lacks view access to the destination workspace.'
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests__requestId__move_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_workspace_id:
                  type: integer
                  format: int64
                request_note:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdMovePostRequestBodyContentApplicationJsonSchemaRequestNote'
                workflow_request_note:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdMovePostRequestBodyContentApplicationJsonSchemaWorkflowRequestNote'
                  description: 'Payload to create a request note. Mentions (`mentions`) and agent-group mentions

                    (`agent_group_mentions`) can be supplied. Public notes notify the requester,

                    assignee and all followers (direct users plus members of any agent groups following

                    the request, de-duplicated). Agent groups listed in `agent_group_mentions` are

                    added as request followers.

                    '
                data:
                  $ref: '#/components/schemas/ApiV1RequestsRequestIdMovePostRequestBodyContentApplicationJsonSchemaData'
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/modify-followers:
    put:
      operationId: requests_putapi_v1_requests__requestId__modify_followers
      summary: Add or Remove Followers
      tags:
      - Requests
      parameters:
      - name: requestId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requests_putapi_v1_requests__requestId__modify_followers_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                follower_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      security:
      - ApiKeyAuth: []
  /api/v1/requests/{requestId}/followers:
    get:
      operationId: requests_getapi_v1_requests__requestId__followers
      summary: Get Followers of a Request
      tags:
