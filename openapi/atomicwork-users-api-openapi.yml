      tags:
      - users
      parameters:
      - name: user_id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_getapi_v1_users__user_id_Response_200'
    put:
      operationId: putapi-v-1-users-user-id
      summary: Update User
      tags:
      - users
      parameters:
      - name: user_id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_putapi_v1_users__user_id_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                middle_name:
                  type: string
                last_name:
                  type: string
                personal_email:
                  type: string
                  format: email
                timezone:
                  type: string
                  default: America/Los_Angeles
                language:
                  type: string
                state:
                  type: string
                city:
                  type: string
                country:
                  type: string
                department:
                  type: integer
                  format: int64
                team:
                  type: integer
                  format: int64
                level:
                  type: string
                title:
                  type: string
                address:
                  type: string
                originally_hired:
                  type: string
                  format: date
                joined_on:
                  type: string
                  format: date
                terminated_on:
                  type: string
                  format: date
                employee_id:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                phone_number:
                  type: string
                gender:
                  type: string
                hr:
                  type: integer
                  format: int64
                manager:
                  type: integer
                  format: int64
                company_legal_entity:
                  type: integer
                  format: int64
                employment_status:
                  type: string
                slack_id:
                  type: string
                azure_id:
                  type: string
                external_id:
                  type: string
                external_app_type:
                  $ref: '#/components/schemas/ApiV1UsersUserIdPutRequestBodyContentApplicationJsonSchemaExternalAppType'
                org_roles:
                  type: array
                  items:
                    type: integer
                    format: int64
                password:
                  type: string
                profile_image:
                  type: integer
                  format: int64
                custom_fields:
                  $ref: '#/components/schemas/ApiV1UsersUserIdPutRequestBodyContentApplicationJsonSchemaCustomFields'
                is_deleted:
                  type: boolean
                has_reporters:
                  type: boolean
                  default: false
                notification_enabled:
                  type: boolean
                  description: Enable/disable notifications for the user
    delete:
      operationId: deleteapi-v-1-users-user-id
      summary: Delete user from organization
      tags:
      - users
      parameters:
      - name: user_id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_deleteapi_v1_users__user_id_Response_200'
    patch:
      operationId: patchapi-v-1-users-user-id
      summary: Patch a user
      tags:
      - users
      parameters:
      - name: user_id
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_patchapi_v1_users__user_id_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /api/v1/users/{user_id}/properties:
