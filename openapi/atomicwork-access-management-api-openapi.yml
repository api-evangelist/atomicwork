openapi: 3.2.0
info:
  title: Atomicwork Public Access Management API
  version: 1.0.0
servers:
- url: https://{tenant}.atomicwork.com
  description: Your Atomicwork tenant
tags:
- name: Access Management
paths:
  /api/v1/iga/grants:
    post:
      operationId: accessManagement_postapi_v1_iga_grants
      summary: Create a grant for a user
      description: 'Create an identity grant directly without going through the IGA workflow.

        Requires user_id and entitlement_id. Optionally specify policy, granted_by, and granted_at.

        The grant method is automatically derived from the entitlement''s provisioning config.'
      tags:
      - Access Management
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_postapi_v1_iga_grants_Response_200'
      requestBody:
        description: Request body for creating a grant via the public API
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int64
                  description: The ID of the user who will receive the grant
                entitlement_id:
                  type: integer
                  format: int64
                  description: The ID of the entitlement to grant
                policy_id:
                  type: integer
                  format: int64
                  description: Optional policy ID to associate with the grant
                policy_key:
                  type: string
                  description: Optional policy key (alternative to policy_id)
                granted_by:
                  type: integer
                  format: int64
                  description: Optional user ID of who authorized this grant. Defaults to the API key owner.
                granted_at:
                  type: string
                  format: date-time
                  description: Optional timestamp of when the grant was authorized. Defaults to current time.
              required:
              - user_id
              - entitlement_id
      security:
      - ApiKeyAuth: []
  /api/v1/iga/grants/list:
    post:
      operationId: accessManagement_postapi_v1_iga_grants_list
      summary: List grants with filters
      description: 'Search and list identity grants with advanced filtering. Supports filtering by user, app, entitlement, status, and date ranges via request body filters. ### Filtering


        The request body is an **array of filter objects**. Send an empty array (`[]`) to retrieve all records. Each filter object has the following fields:


        | Field | Type | Description |

        |---|---|---|

        | `attribute` | string | The field to filter on (see Supported attributes below) |

        | `operator` | string | Comparison operator (see Available operators below) |

        | `values` | array | One or more `{ "value": }` objects |


        **Supported attributes**


        | Attribute | Typical operator | Description |

        |---|---|---|

        | `status` | `IS_ANY_OF` | Grant status **bucket** (not the raw status). Accepted values: `ACTIVE` (includes GRANTED and EXTENDED grants), `INACTIVE` (includes REVOKED and EXPIRED grants), `REVOKED` (revoked only). See the Status Reference table below. |

        | `user` | `IS_ANY_OF` | Numeric user ID of the grant recipient (the `id` field from `GET /api/v1/users`). Pass one or more user IDs to filter grants belonging to specific people. |

        | `app` | `IS_ANY_OF` | Application ID — the identity resource app the entitlement belongs to (the `id` field from `GET /api/v1/iga/apps`). Filters grants to entitlements under a specific app. |

        | `entitlement` | `IS_ANY_OF` | Entitlement ID — the specific entitlement (group, role, license, etc.) the grant was issued for. Use `GET /api/v1/iga/entitlements` to discover IDs. |

        | `entitlement_value` | `IS_ANY_OF` | Entitlement value string — filters by the human-readable entitlement value (e.g. the group name or role name) rather than the numeric ID. |

        | `granted_at` | `IS_BETWEEN` | Grant creation timestamp. Requires exactly **two** values: `[start, end]` (both inclusive). Accepts ISO 8601 format (`2024-01-01T00:00:00Z`). |

        | `expires_at` | `IS_BETWEEN` | Grant expiration timestamp. Same format as `granted_at`. Use this to find grants expiring within a specific window. |

        | `last_login_at` | `IS_BETWEEN` | Last login timestamp for the grant recipient. Same format as `granted_at`. Useful for identifying unused grants where the user hasn''t logged in recently. |


        **Available operators**


        | Operator | Meaning |

        |---|---|

        | `EQUALS` | Exact match |

        | `NOT_EQUALS` | Exclude exact match |

        | `IN` / `IS_ANY_OF` | Match any value in the list |

        | `IS_NOT_ANY_OF` | Exclude all listed values |

        | `IS_BETWEEN` | Inclusive range — pass exactly two values: `[start, end]` |

        | `IS_ON_OR_BEFORE` / `IS_ON_OR_AFTER` | Date/time boundary comparisons |

        | `CONTAINS` / `TEXT_CONTAINS` | Substring or set membership |

        | `IS_NULL` / `IS_NOT_NULL` | Null checks — `values` array can be empty |

        | `STARTS_WITH` / `ENDS_WITH` | String prefix/suffix match |


        **Status Reference**


        Grants have a raw status and a **status bucket** used for filtering:


        | Filter value | Raw statuses included | Description |

        |---|---|---|

        | `ACTIVE` | GRANTED, EXTENDED | Currently valid grants |

        | `INACTIVE` | REVOKED, EXPIRED | No longer valid grants |

        | `REVOKED` | REVOKED | Only manually or system-revoked grants |


        **Grant types** (returned in responses, not used as filter attributes)


        | Type | Description |

        |---|---|

        | `BIRTHRIGHT` | Automatically assigned based on user attributes (department, role, etc.) |

        | `PREAPPROVED` | Pre-approved via an access policy — no approval workflow required |

        | `APPROVED` | Granted after completing an approval workflow |


        **Entitlement types** (filter via the entitlements endpoint, not on grants directly)


        | Type | Description |

        |---|---|

        | `GROUP` | Identity provider group membership (e.g.'
      tags:
      - Access Management
      parameters:
      - name: search_key
        in: query
        description: ''
        required: false
        schema:
          type: string
          minLength: 1
      - name: sort_order
        in: query
        description: ''
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1IgaGrantsListPostParametersSortOrder'
      - name: policy_id
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: app_id
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 25
      - name: next_page_token
        in: query
        description: Token from previous response to fetch the next page. When provided, takes priority over page and per_page parameters.
        required: false
        schema:
          type: string
      - name: ids
        in: query
        description: Comma-separated list of grant IDs to filter by. When provided, returns only grants matching these IDs.
        required: false
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_postapi_v1_iga_grants_list_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV1IgaGrantsListPostRequestBodyContentApplicationJsonSchemaItems'
      security:
      - ApiKeyAuth: []
  /api/v1/iga/grants/{grant_id}:
    put:
      operationId: accessManagement_putapi_v1_iga_grants__grant_id
      summary: Update a grant
      description: Update an identity grant's status or policy.
      tags:
      - Access Management
      parameters:
      - name: grant_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_putapi_v1_iga_grants__grant_id_Response_200'
      requestBody:
        description: Request body for updating a grant via the public API
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ApiV1IgaGrantsGrantIdPutRequestBodyContentApplicationJsonSchemaStatus'
                policy_id:
                  type: integer
                  format: int64
                  description: Change the policy associated with the grant
                policy_key:
                  type: string
                  description: Change the policy by key (alternative to policy_id)
                granted_by:
                  type: integer
                  format: int64
                  description: User ID who authorized this grant
                granted_at:
                  type: string
                  format: date-time
                  description: When the grant was authorized
      security:
      - ApiKeyAuth: []
  /api/v1/iga/grants/{grant_id}/revoke:
    post:
      operationId: accessManagement_postapi_v1_iga_grants__grant_id__revoke
      summary: Revoke a grant
      description: 'Revoke a grant. By default (skip_deprovisioning=true), marks the grant as REVOKED

        immediately without triggering IDP deprovisioning. Set skip_deprovisioning=false to

        trigger the full deprovisioning workflow (Azure AD/Okta group removal or service request creation).'
      tags:
      - Access Management
      parameters:
      - name: grant_id
        in: path
        description: The grant ID to revoke
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_postapi_v1_iga_grants__grant_id__revoke_Response_200'
      requestBody:
        description: Request body for revoking a grant via the public API
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional reason for revoking the grant
                skip_deprovisioning:
                  type: boolean
                  default: true
                  description: 'When true (default), marks the grant as REVOKED immediately without triggering IDP deprovisioning. When false, triggers the full deprovisioning workflow (Azure AD/Okta group removal or service request creation).

                    '
      security:
      - ApiKeyAuth: []
  /api/v1/iga/grants/{grant_id}/history:
    get:
      operationId: accessManagement_getapi_v1_iga_grants__grant_id__history
      summary: Get grant history
      description: Retrieves the complete timeline of events for a specific grant
      tags:
      - Access Management
      parameters:
      - name: grant_id
        in: path
        description: The unique identifier of the grant
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 25
      - name: sort_order
        in: query
        description: Sort order for grant history results
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1IgaGrantsGrantIdHistoryGetParametersSortOrder'
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_getapi_v1_iga_grants__grant_id__history_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/iga/apps:
    get:
      operationId: accessManagement_getapi_v1_iga_apps
      summary: List available apps
      description: 'List identity resource apps for grant discovery. Call this first to find

        app IDs, then use the entitlements endpoint to find what can be granted.'
      tags:
      - Access Management
      parameters:
      - name: search_key
        in: query
        description: ''
        required: false
        schema:
          type: string
          minLength: 1
      - name: page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 25
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_getapi_v1_iga_apps_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/iga/entitlements:
    get:
      operationId: accessManagement_getapi_v1_iga_entitlements
      summary: List available entitlements
      description: 'List entitlements available for granting, filterable by app.

        Use app_id from /iga/apps to filter.'
      tags:
      - Access Management
      parameters:
      - name: search_key
        in: query
        description: ''
        required: false
        schema:
          type: string
          minLength: 1
      - name: app_id
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        description: Filter entitlements by type
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1IgaEntitlementsGetParametersType'
      - name: status
        in: query
        description: Filter entitlements by status
        required: false
        schema:
          $ref: '#/components/schemas/ApiV1IgaEntitlementsGetParametersStatus'
      - name: page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 25
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_getapi_v1_iga_entitlements_Response_200'
      security:
      - ApiKeyAuth: []
    post:
      operationId: accessManagement_postapi_v1_iga_entitlements
      summary: Create an entitlement
      description: 'Create a new identity entitlement. Requires app_id and type.

        The entitlement can then be associated with policies and granted to users.'
      tags:
      - Access Management
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_postapi_v1_iga_entitlements_Response_200'
      requestBody:
        description: Request body for creating an entitlement via the public API
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Name of the entitlement
                description:
                  type: string
                  maxLength: 1000
                  description: Description of the entitlement
                app_id:
                  type: integer
                  format: int64
                  description: ID of the identity resource app this entitlement belongs to
                status:
                  $ref: '#/components/schemas/ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: Status of the entitlement. Defaults to PUBLISHED if not specified.
                provisioning_config:
                  $ref: '#/components/schemas/ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaProvisioningConfig'
                deprovisioning_config:
                  $ref: '#/components/schemas/ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaDeprovisioningConfig'
              required:
              - name
              - app_id
      security:
      - ApiKeyAuth: []
  /api/v1/iga/policies:
    post:
      operationId: accessManagement_postapi_v1_iga_policies
      summary: Create a policy
      description: 'Create a new identity policy. Requires name, type, and status.

        Policies define access rules and can be associated with entitlements.'
      tags:
      - Access Management
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access_Management_postapi_v1_iga_policies_Response_200'
      requestBody:
        description: Request body for creating an identity policy via the public API
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the policy
                description:
                  type: string
                  description: Description of the policy
                type:
                  $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaType'
                condition:
                  $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaCondition'
                approvals:
                  $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals'
                lifecycle:
                  $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle'
                status:
                  $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaStatus'
                is_active:
                  type: boolean
                  description: Whether the policy is active
                entitlements:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: List of entitlement IDs to associate with this policy
                app_id:
                  type: integer
                  format: int64
                  description: ID of the identity resource app this policy belongs to
                is_business_justification_required:
                  type: boolean
                  description: Whether business justification is required for requests under this policy
              required:
              - name
              - type
              - status
              - app_id
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
      - UNPUBLISHED
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaStatus
    ApiV1IgaGrantsGrantIdHistoryGetParametersSortOrder:
      type: string
      enum:
      - CREATED_AT_ASC
      - CREATED_AT_DESC
      - UPDATED_AT_ASC
      - UPDATED_AT_DESC
      description: Sort order for grant history
      title: ApiV1IgaGrantsGrantIdHistoryGetParametersSortOrder
    ApiV1IgaEntitlementsGetParametersStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      title: ApiV1IgaEntitlementsGetParametersStatus
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsDurationUnit:
      type: string
      enum:
      - HOURS
      - DAYS
      - WEEKS
      - MONTHS
      description: Time unit for duration specifications
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsDurationUnit
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItemsOneOf0Criteria:
      type: string
      enum:
      - FIRST_DECISION
      - EVERYONE
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItemsOneOf0Criteria
    ApiV1IgaEntitlementsGetParametersType:
      type: string
      enum:
      - GROUP
      - ROLE
      title: ApiV1IgaEntitlementsGetParametersType
    Access_Management_postapi_v1_iga_entitlements_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Access Management_postapi_v1_iga_entitlements_Response_200
    ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaProvisioningConfigValueIcon:
      type: object
      properties:
        name:
          type: string
          description: Icon name
        type:
          type: string
          description: Icon type
        url:
          type:
          - string
          - 'null'
          description: Icon URL (for OKTA/AZURE)
      title: ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaProvisioningConfigValueIcon
    Access_Management_postapi_v1_iga_grants_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Access Management_postapi_v1_iga_grants_Response_200
    ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaStatus:
      type: string
      enum:
      - UNPUBLISHED
      - PUBLISHED
      description: Status of the entitlement. Defaults to PUBLISHED if not specified.
      title: ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaStatus
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsDuration:
      type: object
      properties:
        id:
          type: string
          description: 'Unique identifier in format: {value}_{unit}'
        value:
          type: integer
          minimum: 1
          description: The numeric value of the duration
        unit:
          $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsDurationUnit'
          description: Time unit for duration specifications
      required:
      - value
      - unit
      description: Represents a duration with a value and time unit. Includes ID field for AI-agent friendly selection.
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsDuration
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaCondition0:
      type: object
      properties:
        type:
          type: string
          minLength: 2
        values:
          type: array
          items:
            type: integer
            format: int64
      required:
      - type
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaCondition0
    Access_Management_putapi_v1_iga_grants__grant_id_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Access Management_putapi_v1_iga_grants__grant_id_Response_200
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle:
      oneOf:
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle0'
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle1'
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals:
      oneOf:
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals0'
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals1'
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals
    ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaProvisioningConfigType:
      type: string
      enum:
      - OKTA_GROUP_PROVISIONING
      - AZURE_GROUP_PROVISIONING
      - INTUNE_GROUP_PROVISIONING
      - JUMPCLOUD_GROUP_PROVISIONING
      - GOOGLE_WORKSPACE_GROUP_PROVISIONING
      - MANUAL_PROVISIONING
      description: Type of provisioning configuration
      title: ApiV1IgaEntitlementsPostRequestBodyContentApplicationJsonSchemaProvisioningConfigType
    ApiV1IgaGrantsListPostRequestBodyContentApplicationJsonSchemaItemsValuesItems:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/ApiV1IgaGrantsListPostRequestBodyContentApplicationJsonSchemaItemsValuesItemsValue'
          description: 'A bare scalar - number, string or boolean - never a JSON object or array. For entity-reference attributes pass the numeric id (e.g. 4009, not {"id": 4009}).'
        nested_filter:
          description: Any type
      title: ApiV1IgaGrantsListPostRequestBodyContentApplicationJsonSchemaItemsValuesItems
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItems:
      oneOf:
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItems0'
      - $ref: '#/components/schemas/ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItems1'
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovalsOneOf1StepsItems
    Access_Management_getapi_v1_iga_apps_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Access Management_getapi_v1_iga_apps_Response_200
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals0:
      type: object
      properties:
        type:
          type: string
          minLength: 2
      required:
      - type
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaApprovals0
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle0:
      type: object
      properties:
        type:
          type: string
          minLength: 2
      required:
      - type
      title: ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycle0
    Access_Management_postapi_v1_iga_grants__grant_id__revoke_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Access Management_postapi_v1_iga_grants__grant_id__revoke_Response_200
    ApiV1IgaPoliciesPostRequestBodyContentApplicationJsonSchemaLifecycleOneOf1AllowedAccessDurationsItemsNotificationSettings:
      type: object
      properties:
        enable_expiry_notifications:
          type: boolean
          default: false
          description: Whether expiry notifications are enabled
        notification_timings:
          type: array
          items:
