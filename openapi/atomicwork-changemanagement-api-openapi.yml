      tags:
      - changeManagement
      parameters:
      - name: problem_display_id
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: X-Api-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change Management_postapi_v1_change_management_changes_Response_200'
      requestBody:
        content:
