                  format: int64
                requester:
                  type: integer
                  format: int64
                owner:
                  type: integer
                  format: int64
                agent_group:
                  type: integer
                  format: int64
                assignee:
                  type: integer
                  format: int64
                change_type:
                  type: string
                change_template:
                  type: integer
                  format: int64
                change_start_date:
                  type: string
                  format: date-time
                change_completion_date:
                  type: string
                  format: date-time
                planned_change_start_date:
                  type: string
                  format: date-time
                planned_change_completion_date:
                  type: string
                  format: date-time
                actual_change_start_date:
                  type: string
                  format: date-time
                actual_change_completion_date:
                  type: string
                  format: date-time
                subject:
                  type: string
                priority:
                  type: string
                status:
                  type: string
                impact:
                  type: string
                urgency:
                  type: string
                parent_change_id:
                  type: integer
                  format: int64
                parent_display_id:
                  type: string
                  description: Formatted display ID of the parent (e.g. CHG-5 or REQ-123)
                parent_request_type:
                  type: string
                  description: Entity type of the parent (CHANGE or REQUEST)
                description:
                  type: string
                attachments:
                  type: array
                  items:
                    type: integer
                    format: int64
                tags:
                  type: array
                  items:
                    type: integer
                    format: int64
                workspace_id:
                  type: integer
                  format: int64
                assets:
                  type: array
                  items:
                    type: integer
                    format: int64
                linked_requests:
                  type: array
                  items:
                    type: string
                custom_fields:
                  $ref: '#/components/schemas/ApiV1ChangeManagementChangesPostRequestBodyContentApplicationJsonSchemaCustomFields'
                template_fields:
                  $ref: '#/components/schemas/ApiV1ChangeManagementChangesPostRequestBodyContentApplicationJsonSchemaTemplateFields'
