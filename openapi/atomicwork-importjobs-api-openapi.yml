openapi: 3.2.0
info:
  title: Atomicwork Public Import Jobs API
  version: 1.0.0
servers:
- url: https://{tenant}.atomicwork.com
  description: Your Atomicwork tenant
tags:
- name: importJobs
paths:
  /api/v1/import-jobs:
    get:
      operationId: importJobs_getapi_v1_import_jobs
      summary: List import jobs
      tags:
      - importJobs
      parameters:
      - name: entity_type
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: entity_id
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int64
      - name: source_type
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: created_by
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: ''
        required: false
        schema:
          type: integer
          default: 25
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_getapi_v1_import_jobs_Response_200'
      security:
      - ApiKeyAuth: []
    post:
      operationId: importJobs_postapi_v1_import_jobs
      summary: Create an import job and start validation
      tags:
      - importJobs
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_postapi_v1_import_jobs_Response_200'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Source CSV file
                config:
                  description: Any type
              required:
              - file
      security:
      - ApiKeyAuth: []
  /api/v1/import-jobs/importable-fields:
    get:
      operationId: importJobs_getapi_v1_import_jobs_importable_fields
      summary: List importable fields for an entity_type / entity_id, with auto-mapping…
      tags:
      - importJobs
      parameters:
      - name: entity_type
        in: query
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/ApiV1ImportJobsImportableFieldsGetParametersEntityType'
      - name: entity_id
        in: query
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_getapi_v1_import_jobs_importable_fields_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/import-jobs/sample-template:
    get:
      operationId: importJobs_getapi_v1_import_jobs_sample_template
      summary: Download a sample CSV template for the given entity type
      tags:
      - importJobs
      parameters:
      - name: entity_type
        in: query
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/ApiV1ImportJobsSampleTemplateGetParametersEntityType'
      - name: entity_id
        in: query
        description: ''
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_getapi_v1_import_jobs_sample_template_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/import-jobs/validate-mapping:
    post:
      operationId: importJobs_postapi_v1_import_jobs_validate_mapping
      summary: Validate adapter_config + CSV headers without uploading the file
      tags:
      - importJobs
      parameters:
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_postapi_v1_import_jobs_validate_mapping_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_type:
                  $ref: '#/components/schemas/ApiV1ImportJobsValidateMappingPostRequestBodyContentApplicationJsonSchemaEntityType'
                source_type:
                  $ref: '#/components/schemas/ApiV1ImportJobsValidateMappingPostRequestBodyContentApplicationJsonSchemaSourceType'
                adapter_config:
                  $ref: '#/components/schemas/ApiV1ImportJobsValidateMappingPostRequestBodyContentApplicationJsonSchemaAdapterConfig'
                  description: Same shape used by POST /import-jobs.
                csv_headers:
                  type: array
                  items:
                    type: string
                  description: Parsed header row. Server strips whitespace and BOM before comparison.
                validation:
                  $ref: '#/components/schemas/ApiV1ImportJobsValidateMappingPostRequestBodyContentApplicationJsonSchemaValidation'
                  description: Optional; defaults applied when omitted.
              required:
              - entity_type
              - source_type
              - adapter_config
              - csv_headers
      security:
      - ApiKeyAuth: []
  /api/v1/import-jobs/{id}:
    get:
      operationId: importJobs_getapi_v1_import_jobs__id
      summary: Get an import job by id
      tags:
      - importJobs
      parameters:
      - name: id
        in: path
        description: Workspace ID (numeric). Find yours under Settings → Workspace.
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_Jobs_getapi_v1_import_jobs__id_Response_200'
      security:
      - ApiKeyAuth: []
  /api/v1/import-jobs/{id}/validation:
