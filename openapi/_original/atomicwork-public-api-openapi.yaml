  /api/v1/workspaces/{workspace_id}/change-management/changes/list:
    post:
      operationId: postapi-v-1-workspaces-workspace-id-change-management-changes-list
      summary: Get changes by filter
      description: |

        ### Filtering

        The request body is an **array of filter objects**. Send an empty array (`[]`) to retrieve all records.

        Each filter object has the following fields:

        | Field | Type | Description |
        |---|---|---|
        | `attribute` | string | The field to filter on (see Supported attributes below) |
        | `operator` | string | Comparison operator (see Available operators below) |
        | `values` | array | One or more `{ "value": <scalar> }` objects |

        **Supported attributes**

        | Attribute | Typical operator | Description |
        |---|---|---|
        | `status` | `IS_ANY_OF` | Change status (e.g. `DRAFT`, `IN_REVIEW`, `APPROVED`, `IMPLEMENTED`). |
        | `type` | `IS_ANY_OF` | Change type. |
        | `assignee_id` | `IS_ANY_OF` | Assigned agent user ID. |
        | `created_at` | `IS_BETWEEN` | Creation timestamp (ISO 8601). |

        **Available operators**

        | Operator | Meaning |
        |---|---|
        | `EQUALS` | Exact match |
        | `NOT_EQUALS` | Exclude exact match |
        | `IN` / `IS_ANY_OF` | Match any value in the list |
        | `IS_NOT_ANY_OF` | Exclude all listed values |
        | `IS_BETWEEN` | Inclusive range — pass exactly two values: `[start, end]` |
        | `IS_ON_OR_BEFORE` / `IS_ON_OR_AFTER` | Date/time boundary comparisons |
        | `CONTAINS` / `TEXT_CONTAINS` | Substring or set membership |
        | `IS_NULL` / `IS_NOT_NULL` | Null checks — `values` array can be empty |
        | `STARTS_WITH` / `ENDS_WITH` | String prefix/suffix match |

        **Example**

        ```json
        [
          {
            "attribute": "status",
            "operator": "IS_ANY_OF",
            "values": [
              {
                "value": "DRAFT"
              },
              {
                "value": "IN_REVIEW"
              }
            ]
          },
          {
            "attribute": "created_at",
            "operator": "IS_BETWEEN",
            "values": [
              {
                "value": "2024-01-01T00:00:00Z"
              },
              {
                "value": "2024-12-31T23:59:59Z"
              }
            ]
          }
        ]
        ```
      tags:
        - changeManagement
      parameters:
        - name: workspace_id
          in: path
          description: Workspace ID (numeric). Find yours under Settings → Workspace.
          required: true
          schema:
            type: integer
            format: int64
        - name: filter_name
          in: query
          description: ''
          required: true
          schema:
            type: string
        - name: sort_order
          in: query
          description: ''
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1WorkspacesWorkspaceIdChangeManagementChangesListPostParametersSortOrder'
        - name: sort
          in: query
          description: >
            Comma-separated sort keys as `field:direction` (e.g. `status:asc,created_at:desc`), up to 2 keys. Field keys
            come from GET /views/CHANGE/fields (entries with `sortable: true`). Takes precedence over `sort_order`.
            Invalid/unknown fields -> 400.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: ''
          required: true
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: ''
          required: false
          schema:
            type: integer
            default: 25
        - name: paginate
          in: query
          description: ''
          required: false
          schema:
            type: boolean
            default: true
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Change
                  Management_postapi_v1_workspaces__workspace_id__change_management_changes_list_Response_200
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: >-
                  #/components/schemas/ApiV1WorkspacesWorkspaceIdChangeManagementChangesListPostRequestBodyContentApplicationJsonSchemaItems
