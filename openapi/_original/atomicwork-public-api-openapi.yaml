  /api/v1/assets/list:
    post:
      operationId: postapi-v-1-assets-list
      summary: Asset List with views, and filters.
      description: |

        ### Filtering

        The request body is an **array of filter objects**. Send an empty array (`[]`) to retrieve all records.

        Each filter object has the following fields:

        | Field | Type | Description |
        |---|---|---|
        | `attribute` | string | The field to filter on (see Supported attributes below) |
        | `operator` | string | Comparison operator (see Available operators below) |
        | `values` | array | One or more `{ "value": <scalar> }` objects |

        **Supported attributes**

        | Attribute | Typical operator | Description |
        |---|---|---|
        | `status` | `IS_ANY_OF` | Asset status (e.g. `IN_USE`, `AVAILABLE`, `RETIRED`). |
        | `type_id` | `IS_ANY_OF` | Asset type ID. |
        | `assigned_to_id` | `IS_ANY_OF` | User ID the asset is assigned to. |

        **Available operators**

        | Operator | Meaning |
        |---|---|
        | `EQUALS` | Exact match |
        | `NOT_EQUALS` | Exclude exact match |
        | `IN` / `IS_ANY_OF` | Match any value in the list |
        | `IS_NOT_ANY_OF` | Exclude all listed values |
        | `IS_BETWEEN` | Inclusive range — pass exactly two values: `[start, end]` |
        | `IS_ON_OR_BEFORE` / `IS_ON_OR_AFTER` | Date/time boundary comparisons |
        | `CONTAINS` / `TEXT_CONTAINS` | Substring or set membership |
        | `IS_NULL` / `IS_NOT_NULL` | Null checks — `values` array can be empty |
        | `STARTS_WITH` / `ENDS_WITH` | String prefix/suffix match |

        **Example**

        ```json
        [
          {
            "attribute": "status",
            "operator": "IS_ANY_OF",
            "values": [
              {
                "value": "IN_USE"
              },
              {
                "value": "AVAILABLE"
              }
            ]
          }
        ]
        ```
      tags:
        - assets
      parameters:
        - name: sort_order
          in: query
          description: ''
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1AssetsListPostParametersSortOrder'
        - name: sort
          in: query
          description: >-
            Generic multi-column sort, comma-separated `field:DIRECTION` (e.g. `display_name:ASC,created_at:DESC`).
            Sortable fields are those advertised with `sortable: true` by the asset fields endpoint. Takes precedence
            over `sort_order`. Invalid/unknown fields -> 400.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: ''
          required: true
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: ''
          required: false
          schema:
            type: integer
            default: 25
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assets_postapi_v1_assets_list_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV1AssetsListPostRequestBodyContentApplicationJsonSchemaItems'
