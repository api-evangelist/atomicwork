                  type: array
                  items:
                    type: integer
                    format: int64
                cc_emails:
                  type: array
                  items:
                    type: string
                bcc_emails:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  items:
                    type: integer
                    format: int64
                requester:
                  type: integer
                  format: int64
                to_email:
                  type: string
                request_created_from:
                  $ref: '#/components/schemas/ApiV1ProblemsPostRequestBodyContentApplicationJsonSchemaRequestCreatedFrom'
                custom_fields:
                  $ref: '#/components/schemas/ApiV1ProblemsPostRequestBodyContentApplicationJsonSchemaCustomFields'
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                external_id:
                  type: string
                external_source:
                  $ref: '#/components/schemas/ApiV1ProblemsPostRequestBodyContentApplicationJsonSchemaExternalSource'
                resolution_time:
                  type: string
                  format: date-time
                  description: >
                    When the ticket was resolved in the source system. Only accepted during migration (requires
                    external_id or external_source).
                first_response_time:
                  type: string
                  format: date-time
                  description: >
                    When the first agent response occurred in the source system. Only accepted during migration
                    (requires external_id or external_source).
                first_response_due_time:
                  type: string
                  format: date-time
                  description: >
                    SLA due time for first response from the source system. Only accepted during migration (requires
                    external_id or external_source).
                resolution_due_time:
                  type: string
                  format: date-time
                  description: >
                    SLA due time for resolution from the source system. Only accepted during migration (requires
                    external_id or external_source).
                closed_status_at:
                  type: string
                  format: date-time
                  description: >
                    When the ticket was moved to closed status in the source system. Only accepted during migration
                    (requires external_id or external_source). When provided with a closed status, also sets
                    resolution_time if not explicitly provided.
                item_id:
                  type: integer
                  format: int64
                item_fields:
                  $ref: '#/components/schemas/ApiV1ProblemsPostRequestBodyContentApplicationJsonSchemaItemFields'
                impact:
                  type: string
                urgency:
                  type: string
                category:
                  type: string
                subcategory:
                  type: string
                assets:
                  type: array
                  items:
                    type: integer
                    format: int64
