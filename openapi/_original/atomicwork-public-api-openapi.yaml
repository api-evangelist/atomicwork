              schema:
                $ref: '#/components/schemas/Requests_postapi_v1_requests_items__item_id_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_type:
                  type: string
                request_source:
                  $ref: >-
                    #/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaRequestSource
                description:
                  type: string
                email_content:
                  type: string
                plain_text_description_override:
                  type: string
                  description: >
                    Internal-only override for the persisted plain-text rendering of the description. When non-empty,
                    AbstractRequestService persists it as RequestDetail.description instead of running
                    HTMLSanitizerUtil.getPlainText() on the HTML description.

                    Set ONLY by the email ingestion path (EmailIntentBasedRequestCreationService), which derives it from
                    reqDescription via normalizeHtmlToPlainText(getPlainTextForRichHtml(...)) so system-generated HTML
                    emails (BlackLine offboarding, etc.) avoid mashed table cells and blank-line storms.

                    Annotated @JsonIgnore so external HTTP clients cannot set it via the request body — without that
                    annotation, any caller of POST /requests, /service-requests, /incidents could write arbitrary
                    unsanitized text into RequestDetail.description, bypassing the getPlainText() pipeline. The Lombok
                    @SuperBuilder still exposes a setter for in-process Java callers (the email path), since builder
                    access does not go through Jackson.
                status:
                  type: string
                priority:
                  type: string
                parent_request_id:
                  type: integer
                  format: int64
                agent_group:
                  type: integer
                  format: int64
                assignee:
                  type: integer
                  format: int64
                subject:
                  type: string
                notes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaNotesItems'
                workspace_id:
                  type: integer
                  format: int64
                conversation_info:
                  $ref: >-
                    #/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaConversationInfo
                tags:
                  type: array
                  items:
                    type: integer
                    format: int64
                cc_emails:
                  type: array
                  items:
                    type: string
                bcc_emails:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  items:
                    type: integer
                    format: int64
                requester:
                  type: integer
                  format: int64
                to_email:
                  type: string
                request_created_from:
                  $ref: >-
                    #/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaRequestCreatedFrom
                custom_fields:
                  $ref: '#/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaCustomFields'
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                external_id:
                  type: string
                external_source:
                  $ref: >-
                    #/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaExternalSource
                resolution_time:
                  type: string
                  format: date-time
                  description: >
                    When the ticket was resolved in the source system. Only accepted during migration (requires
                    external_id or external_source).
                first_response_time:
                  type: string
                  format: date-time
                  description: >
                    When the first agent response occurred in the source system. Only accepted during migration
                    (requires external_id or external_source).
                first_response_due_time:
                  type: string
                  format: date-time
                  description: >
                    SLA due time for first response from the source system. Only accepted during migration (requires
                    external_id or external_source).
                resolution_due_time:
                  type: string
                  format: date-time
                  description: >
                    SLA due time for resolution from the source system. Only accepted during migration (requires
                    external_id or external_source).
                closed_status_at:
                  type: string
                  format: date-time
                  description: >
                    When the ticket was moved to closed status in the source system. Only accepted during migration
                    (requires external_id or external_source). When provided with a closed status, also sets
                    resolution_time if not explicitly provided.
                item_id:
                  type: integer
                  format: int64
                item_fields:
                  $ref: '#/components/schemas/ApiV1RequestsItemsItemIdPostRequestBodyContentApplicationJsonSchemaItemFields'
