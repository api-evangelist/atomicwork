aid: atomicwork
name: Atomicwork
description: >-
  Atomicwork is an agentic service management (ITSM/ESM) platform that pairs an AI
  "coworker" (Atom) with a modern service desk for IT, HR, and other enterprise
  teams. The Atomicwork Public API gives programmatic, workspace-scoped access to
  the core platform — requests and tickets (incidents, service requests, problems,
  changes, major incidents), assets and a CMDB, users and workspaces, service
  catalog, automation workflows, custom objects, audit logs, and identity
  governance (IGA) grants and entitlements. Authentication is via a workspace-scoped
  API key (X-Api-Key) with an X-Workspace-Id scoping header. Atomicwork also ships
  an official hosted MCP server so AI clients (Claude, Cursor, Copilot, Codex) can
  drive the same operations as tools. The API is documented as OpenAPI 3.1 with 102
  paths across 16 tags, offset and cursor pagination, and a structured filter model.
